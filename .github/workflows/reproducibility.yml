name: Research integrity and reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Artifact replay / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout full history and frozen tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Verify release lineage and immutable historical files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'final-results-v1.0.0^{commit}')" = "210089314901a8f8b0c7441f0333d1309da2c242"
          test "$(git rev-parse 'qmle-audit-v1.0.0^{commit}')" = "67c81034f622dd3f8a9d29b4c4f080fcc27f807c"
          git merge-base --is-ancestor qmle-audit-v1.0.0 HEAD
          git diff --exit-code qmle-audit-v1.0.0 HEAD -- \
            LICENSE NOTICE requirements.txt requirements-lock.txt \
            configs/ src/hc_vol/ results/ \
            docs/model_freeze_manifest_v1.json \
            docs/data_manifest_v1_1.json \
            docs/holdout_runner_manifest_v1.json \
            docs/final_results_audit_v1.json \
            docs/postholdout_diagnostics_v1.json \
            docs/qmle_second_solver_review_v1.md \
            scripts/run_final_holdout.py \
            scripts/verify_public_results.py \
            scripts/audit_second_solver_qmle.py

      - name: Check SHA-256 frozen sources and released artifacts
        run: python scripts/verify_release_integrity.py

      - name: Install version-locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip check
          python -m pip freeze

      - name: Regression and anti-leakage tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -W error::DeprecationWarning -m pytest tests/ -q

      - name: Replay QLIKE, DM-HAC, Holm and 10,000-draw bootstrap
        run: python scripts/verify_public_results.py
